name: GitHub Trending Daily Push

on:
  schedule:
    # UTC 23:23 = 北京时间 07:23（次日）
    - cron: "23 23 * * *"
  workflow_dispatch:   # 支持手动触发测试

jobs:
  push-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GitHub Trending push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_BOT_ID: ${{ secrets.WECOM_BOT_ID }}           # 新：智能机器人 BotID
          WECOM_BOT_SECRET: ${{ secrets.WECOM_BOT_SECRET }}
        run: python scripts/github_trending_push.py
